<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solara Bay — An Open-World Crime Story</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10131a; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: rgba(10, 14, 22, 0.72); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; backdrop-filter: blur(2px); }
  #top-left { position: absolute; top: 14px; left: 14px; padding: 10px 14px; min-width: 230px; }
  #health-bar { width: 100%; height: 12px; background: rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; margin: 6px 0 4px; }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #37c978, #7be495); border-radius: 6px; transition: width 0.2s; }
  #health-text { font-size: 12px; color: #cfe8d4; }
  #money { font-size: 24px; font-weight: 800; color: #7be495; letter-spacing: 0.5px; }
  #top-right { position: absolute; top: 14px; right: 14px; padding: 10px 14px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 3px; line-height: 1; }
  #stars .star { color: rgba(255,255,255,0.25); }
  #stars .star.on { color: #ffd23f; text-shadow: 0 0 8px rgba(255,210,63,0.8); }
  #wanted-label { font-size: 11px; letter-spacing: 2px; color: #ffb3b3; margin-top: 4px; }
  #bottom-left { position: absolute; left: 14px; bottom: 14px; padding: 10px 14px; max-width: 420px; }
  #objective-label { font-size: 11px; letter-spacing: 2px; color: #ffd23f; }
  #objective { font-size: 15px; font-weight: 600; margin-top: 3px; }
  #speed { font-size: 12px; color: #b8c4d4; margin-top: 5px; }
  #bottom-right { position: absolute; right: 14px; bottom: 14px; padding: 8px; }
  #minimap { display: block; width: 190px; height: 190px; border-radius: 6px; }
  #toast {
    position: absolute; top: 84px; left: 50%; transform: translateX(-50%) translateY(-8px);
    padding: 10px 22px; font-size: 15px; font-weight: 600; opacity: 0; transition: opacity 0.25s, transform 0.25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #mission-banner {
    position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    padding: 18px 30px; text-align: center; max-width: 560px; opacity: 0; transition: opacity 0.3s;
  }
  #mission-banner.show { opacity: 1; }
  #banner-title { font-size: 26px; font-weight: 800; color: #ffd23f; }
  #banner-story { font-size: 15px; color: #e8ecf2; margin-top: 8px; line-height: 1.45; }
  #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,0.65); padding: 6px 14px; white-space: nowrap; }

  /* Menus */
  #menu {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: linear-gradient(180deg, rgba(8,12,20,0.55), rgba(8,12,20,0.82)); text-align: center; padding: 20px;
  }
  #menu.show { display: flex; }
  #menu-title {
    font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #ffd23f;
    text-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 0 42px rgba(255,210,63,0.35);
  }
  #menu-story { font-size: 17px; color: #dfe6ef; max-width: 620px; margin: 14px 0 26px; line-height: 1.5; }
  #menu-buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .menu-btn {
    pointer-events: auto; cursor: pointer; min-width: 280px; padding: 14px 26px;
    font-size: 17px; font-weight: 700; font-family: inherit; color: #10131a;
    background: #ffd23f; border: none; border-radius: 999px;
    box-shadow: 0 4px 0 #b8931f; transition: transform 0.08s, box-shadow 0.08s;
  }
  .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #b8931f; }
  .menu-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8931f; }
  #menu-foot { margin-top: 26px; font-size: 12px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="top-left" class="panel">
    <div id="money">$50</div>
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="health-text">100 HP</div>
  </div>
  <div id="top-right" class="panel">
    <div id="stars"></div>
    <div id="wanted-label">WANTED</div>
  </div>
  <div id="bottom-left" class="panel">
    <div id="objective-label">OBJECTIVE</div>
    <div id="objective">Welcome to Solara Bay</div>
    <div id="speed">On foot</div>
  </div>
  <div id="bottom-right" class="panel">
    <canvas id="minimap" width="190" height="190"></canvas>
  </div>
  <div id="toast" class="panel"></div>
  <div id="mission-banner" class="panel">
    <div id="banner-title"></div>
    <div id="banner-story"></div>
  </div>
  <div id="hint" class="panel"></div>
</div>

<div id="menu">
  <div id="menu-title">SOLARA BAY</div>
  <div id="menu-story"></div>
  <div id="menu-buttons"></div>
  <div id="menu-foot">An original open-world crime game · Solara Bay is a fictional city · WASD move &amp; drive · E enter car · Mouse aim, click shoot · Shift sprint · P pause · M mute</div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
